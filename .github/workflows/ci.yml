name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY SCAN
# Runs on every push/PR. Results appear in the GitHub Security tab.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  security-scan:
    name: Security — Trivy SAST & dependency scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload SARIF
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

# ─────────────────────────────────────────────────────────────────────────────
# CONTRACT — build, lint, test, coverage, wasm artifact
# ─────────────────────────────────────────────────────────────────────────────
  contract-test:
    name: Contract — fmt / clippy / test / coverage / wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Restore compiled deps from cache — keyed on Cargo.toml hashes because
      # there is no committed Cargo.lock for this library crate.
      - name: Cache cargo registry & build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # Pin ed25519-dalek to 2.x to avoid a rand_core version conflict.
      # soroban-env-host 21.2.1 uses `ed25519-dalek = ">=2.0.0"` which Cargo
      # resolves to 3.0.0; that version upgraded to rand_core 0.9, but
      # rand_chacha 0.3.1 (also pulled by soroban-env-host) uses rand_core 0.6,
      # making ChaCha20Rng fail the CryptoRng bound in testutils.rs.
      - name: Pin ed25519-dalek to 2.x (soroban-env-host compat)
        run: cargo update -p ed25519-dalek --precise 2.1.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run contract tests
        run: cargo test -p payroll-remit --verbose

      # ── Event-spec verification ─────────────────────────────────────────────
      # Asserts that every required event symbol and its payload fields are
      # present in the contract source. This acts as a lightweight contract-spec
      # gate: if an event is renamed or its struct fields change, CI fails fast
      # without waiting for integration tests.
      - name: Verify event specs in contract source
        run: |
          set -euo pipefail
          SRC=contracts/payroll-remit/src/lib.rs

          check() {
            local label="$1"; shift
            for pattern in "$@"; do
              if ! grep -qF "$pattern" "$SRC"; then
                echo "FAIL [$label]: expected to find '$pattern' in $SRC"
                exit 1
              fi
            done
            echo "OK [$label]"
          }

          # init → topic "init", struct InitializedEvent { admin, token, timestamp }
          check "InitializedEvent" \
            'symbol_short!("init")' \
            'pub struct InitializedEvent' \
            'pub admin: Address' \
            'pub token: Address' \
            'pub timestamp: u64'

          # add_recipient → topic "rcpt_add" + recipient topic, struct RecipientAddedEvent
          check "RecipientAddedEvent" \
            'symbol_short!("rcpt_add")' \
            'pub struct RecipientAddedEvent' \
            'pub off_ramp_ref: String' \
            'pub timestamp: u64'

          # batch_payout → topic "payout", struct PayoutBatchEvent { recipients, amounts, timestamp }
          check "PayoutBatchEvent" \
            'symbol_short!("payout")' \
            'pub struct PayoutBatchEvent' \
            'pub recipients: Vec<Address>' \
            'pub amounts: Vec<i128>' \
            'pub timestamp: u64'

          # record_offramp → topic "offramp" + recipient topic, struct OffRampRecordedEvent
          check "OffRampRecordedEvent" \
            'symbol_short!("offramp")' \
            'pub struct OffRampRecordedEvent' \
            'pub status: OffRampStatus' \
            'pub timestamp: u64'

          # set_role → topic "role_set" + grantee topic, struct RoleSetEvent
          check "RoleSetEvent" \
            'symbol_short!("role_set")' \
            'pub struct RoleSetEvent' \
            'pub role: Role' \
            'pub timestamp: u64'

          echo "All event specs verified."

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate contract coverage (Cobertura)
        run: >
          cargo tarpaulin
          -p payroll-remit
          --engine llvm
          --out Xml
          --output-dir coverage/

      - name: Upload contract coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          flags: contracts
          fail_ci_if_error: false

      - name: Build optimised wasm artifact
        run: cargo build --target wasm32-unknown-unknown --release -p payroll-remit

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: payroll-remit-wasm
          path: target/wasm32-unknown-unknown/release/payroll_remit.wasm
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# WEB — lint, typecheck, test, build, coverage
# ─────────────────────────────────────────────────────────────────────────────
  web-ci:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Provide dummy env vars so next build doesn't fail on missing values
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NEXT_PUBLIC_CONTRACT_ID: PLACEHOLDER
      NEXT_PUBLIC_SETTLEMENT_TOKEN: PLACEHOLDER
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npx jest --coverage --passWithNoTests

      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/web/coverage/coverage-final.json
          flags: web
          fail_ci_if_error: false

      - name: Build production bundle
        run: npm run build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next/
          retention-days: 3

# ─────────────────────────────────────────────────────────────────────────────
# DOCKER — build and smoke-test the web image
# ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build web image
    runs-on: ubuntu-latest
    needs: [web-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: stellar-remit-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY — testnet contract deploy (main branch only)
# Requires the SOROBAN_DEPLOYER_SECRET repository/environment secret.
# ─────────────────────────────────────────────────────────────────────────────
  deploy-testnet:
    name: Deploy — contract to testnet
    runs-on: ubuntu-latest
    needs: [contract-test, web-ci, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: testnet
      url: https://stellar.expert/explorer/testnet
    permissions:
      contents: write   # to write CONTRACT_ID back to repo env
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deploy-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-deploy-${{ runner.os }}-

      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-remit-wasm
          path: dist

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --features opt

      - name: Add deployer identity
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_DEPLOYER_SECRET }}
        run: stellar keys add deployer --secret-key "$SOROBAN_SECRET_KEY"

      - name: Deploy contract to testnet
        id: deploy
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_DEPLOYER_SECRET }}
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm dist/payroll_remit.wasm \
            --source deployer \
            --network testnet)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed contract ID: $CONTRACT_ID"

      - name: Write contract ID to GitHub step summary
        run: |
          echo "## Testnet Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract ID | \`${{ steps.deploy.outputs.contract_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | testnet |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Explorer | [View on stellar.expert](https://stellar.expert/explorer/testnet/contract/${{ steps.deploy.outputs.contract_id }}) |" >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY — web (Vercel preview on PR, production on main)
# Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets.
# Remove this job if you are not deploying to Vercel.
# ─────────────────────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy — web to Vercel
    runs-on: ubuntu-latest
    needs: [web-ci, security-scan]
    if: ${{ !failure() && !cancelled() }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=$VERCEL_TOKEN

      - name: Build for Vercel
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        id: vercel-deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN)
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post deployment URL to step summary
        run: |
          echo "## Web Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.vercel-deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
