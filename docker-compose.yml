version: "3.9"

services:
  stellar-quickstart:
    image: stellar/quickstart:testing
    command: --local --enable-soroban-rpc
    ports:
      - "8000:8000"   # Horizon + Soroban RPC + Friendbot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/soroban/rpc"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SOROBAN_RPC_URL=http://localhost:8000/soroban/rpc
      - NEXT_PUBLIC_NETWORK_PASSPHRASE=Standalone Network ; February 2017
    depends_on:
      stellar-quickstart:
        condition: service_healthy

  contracts:
    build:
      context: .
      dockerfile: docker/Dockerfile.contracts
    profiles: ["test"]
    depends_on:
      stellar-quickstart:
        condition: service_healthy
